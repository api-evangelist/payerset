aid: payerset
url: https://raw.githubusercontent.com/api-evangelist/payerset/refs/heads/main/apis.yml
name: Payerset
kind: company
description: Payerset is a healthcare price transparency data company that parses
  every payer Transparency in Coverage (TiC) machine-readable file and compliant
  hospital MRF each quarter, enriches negotiated rates with provider, payer, and
  claims metadata, and delivers it as analytics-ready datasets. The Payerset Data
  Lake API exposes payer-provider negotiated rate lookups, NPI/TIN provider
  mapping, billing-code classification, and hospital MRF discovery via a REST API
  authenticated with an x-api-key header.
