description: >-
  FinOps view of Payerset spend. Payerset is sold as an enterprise
  subscription (Rate Explorer platform and Data Lake) via sales-led
  contracts rather than usage-metered, self-service API billing. Cost is
  driven by license scope - which datasets (TiC negotiated rates, hospital
  MRF, provider mappings, claims enrichment), which delivery channels (REST
  API, S3 cloud share, Snowflake Marketplace), and license structure. No
  public per-call or per-record rates are published; figures are not
  reconciled.
notes: >-
  Payerset does not publish usage-based unit economics. Negotiate contract
  scope and reconcile cost drivers (datasets, delivery, seats) with Payerset
  sales during reconciliation.
