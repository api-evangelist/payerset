meters:
- name: data_lake_license
  description: Annual enterprise license for Data Lake dataset access; scope-based, not usage-metered.
  unit: contract
  aggregation: max
  dimensions:
  - account
  - dataset
  - delivery_channel
- name: rate_explorer_seats
  description: Rate Explorer platform subscription, potentially seat- or org-scoped.
  unit: seats
  aggregation: max
  dimensions:
  - account
- name: api_requests
  description: REST API requests against the Data Lake API; not separately metered for billing in published materials.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
principles:
- name: Visibility
  description: Track which datasets and delivery channels are licensed; map contract line items to internal use cases.
- name: Allocation
  description: Tag Data Lake access and Rate Explorer seats to teams / cost centers consuming price transparency data.
- name: Optimization
  description: License only the datasets and delivery channels needed; consolidate S3 / Snowflake / API delivery to avoid duplicate spend.
- name: Accountability
  description: Assign an owner for the Payerset contract; review scope annually against actual analytics usage.
